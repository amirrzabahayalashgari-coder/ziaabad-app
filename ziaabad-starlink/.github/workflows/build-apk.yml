name: Build Ziaabad Starlink APK

on:
  push:
    paths:
      - 'ziaabad-starlink/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ziaabad-starlink
        run: gradle --no-daemon assembleDebug

      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ziaabad-Starlink-APK
          path: ziaabad-starlink/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Ziaabad Starlink Android" --notes "Automatically built Android APK."
          gh release upload android-latest ziaabad-starlink/app/build/outputs/apk/debug/app-debug.apk --clobber
