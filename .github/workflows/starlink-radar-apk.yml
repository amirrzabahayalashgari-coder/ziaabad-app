name: STARLINK RADAR Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'STARLINK-RADAR/**'
      - '.github/workflows/starlink-radar-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android project
        run: |
          test -f STARLINK-RADAR/settings.gradle
          test -f STARLINK-RADAR/build.gradle
          test -f STARLINK-RADAR/app/build.gradle
          test -f STARLINK-RADAR/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: STARLINK-RADAR
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STARLINK-RADAR-debug-apk
          path: STARLINK-RADAR/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
