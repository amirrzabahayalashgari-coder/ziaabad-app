name: Build ZiaAI Persian APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ZiaAI-Persian-source.zip"
      - ".github/workflows/ziaai-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract project source
        run: unzip -q ZiaAI-Persian-source.zip
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon -p ZiaAI-Persian assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZiaAI-Persian-debug-apk
          path: ZiaAI-Persian/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
