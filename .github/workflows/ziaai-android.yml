name: Build ZiaAI Persian APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ZiaAI-Persian-source.zip"
      - ".github/workflows/ziaai-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect and extract source
        shell: bash
        run: |
          set -euo pipefail
          test -s ZiaAI-Persian-source.zip
          unzip -t ZiaAI-Persian-source.zip
          unzip -q ZiaAI-Persian-source.zip
          find . -maxdepth 5 -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            | sort > source-files.txt
          cat source-files.txt
          test -d ZiaAI-Persian

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build and verify debug APK
        shell: bash
        run: |
          set -uo pipefail
          gradle --no-daemon --stacktrace -p ZiaAI-Persian assembleDebug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          APK="ZiaAI-Persian/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK" | tee -a build.log
          sha256sum "$APK" | tee -a build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZiaAI-Persian-debug-apk
          path: ZiaAI-Persian/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZiaAI-build-diagnostics
          path: |
            source-files.txt
            build.log
          if-no-files-found: warn
          retention-days: 14
