name: Build ZiaAI User and Admin APKs
on:
  push:
    branches: [ziaai-online]
    paths: ['android-clients/**', '.github/workflows/ziaai-two-apks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build both debug APKs
        run: gradle --no-daemon -p android-clients assembleDebug
      - name: Verify APK outputs
        run: |
          test -s android-clients/ziaai-user/build/outputs/apk/debug/ziaai-user-debug.apk || test -s android-clients/ziaai-user/build/outputs/apk/debug/app-debug.apk
          test -s android-clients/ziaai-admin/build/outputs/apk/debug/ziaai-admin-debug.apk || test -s android-clients/ziaai-admin/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZiaAI-Two-APKs
          path: |
            android-clients/ziaai-user/build/outputs/apk/debug/*.apk
            android-clients/ziaai-admin/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
