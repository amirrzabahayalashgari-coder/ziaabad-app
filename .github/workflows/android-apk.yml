name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'ziaabad-part-0'
      - 'ziaabad-part-1'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f ziaabad-part-0 || { echo "::error::Missing ziaabad-part-0"; exit 1; }
          test -f ziaabad-part-1 || { echo "::error::Missing ziaabad-part-1"; exit 1; }
          cat ziaabad-part-0 ziaabad-part-1 > ziaabad-android-ready.zip
          unzip -tq ziaabad-android-ready.zip
          mkdir -p source
          unzip -q ziaabad-android-ready.zip -d source
          PROJECT="$(find source -name package.json -printf '%h\n' | head -n 1)"
          test -n "$PROJECT" || { echo "::error::package.json was not found in the uploaded ZIP."; exit 1; }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ziaabad-android-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
